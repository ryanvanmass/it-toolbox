name: Package Linux

on:
  workflow_call:
  workflow_dispatch:

# Two separate jobs because the vendored venv is tied to the build host's
# Python minor version (see the header of packaging/linux/build.sh): the
# .deb has to be built against Ubuntu's Python and the .rpm against
# Fedora's, or the installed package fails at launch with
# "ModuleNotFoundError: No module named 'it_toolbox'".
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ruby-full build-essential rpm \
            pkg-config libgirepository-2.0-dev libcairo2-dev \
            gobject-introspection python3-dev
          sudo gem install --no-document fpm

      - name: Build .deb
        run: bash packaging/linux/build.sh deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/packages/*.deb
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    # Pinned, not `latest`: a new Fedora release usually bumps Python, and
    # the package pins the exact Python it was built against, so bump this
    # deliberately.
    container: fedora:44
    steps:
      - name: Install build tooling
        run: |
          dnf install -y \
            git sudo rpm-build ruby ruby-devel rubygems gcc gcc-c++ make \
            redhat-rpm-config pkgconf-pkg-config \
            python3 python3-pip python3-devel \
            cairo-devel cairo-gobject-devel gobject-introspection-devel
          gem install --no-document fpm

      - uses: actions/checkout@v4

      - name: Build .rpm
        run: bash packaging/linux/build.sh rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/packages/*.rpm
          if-no-files-found: error
