# /etc/wsl.conf for the app-managed "it-toolbox" distro.

[user]
# Everything the app runs here (virsh, virt-install, the SPICE helper)
# works unprivileged; ~/.ssh is synced into this user's home.
default = toolbox

[boot]
# Nothing here needs an init system, and the distro boots faster without.
systemd = false

[interop]
# Keep Windows' PATH out, so a Windows ssh.exe/python.exe can never
# shadow the Linux one. wsl.exe --exec still works with interop on.
appendWindowsPath = false

[automount]
# core/linux_backend.windows_to_wsl_path assumes the default /mnt/<drive>.
root = /mnt/
