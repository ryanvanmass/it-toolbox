[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-toolbox"
version = "0.3.11-beta.3"
description = "Cross-platform IT tooling desktop app — starting with a GCP IAP connection manager for RDP/SSH."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "PySide6",
    "google-auth",
    "requests",
    "websockets",
    "platformdirs",
    "pyte",
    "ptyprocess; sys_platform != 'win32'",
    "pywinpty; sys_platform == 'win32'",
    "PyGObject; sys_platform == 'linux'",
    "packaging",
    "pyrage",
    "cryptography",
    "bcrypt",
    "paramiko",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]

[project.gui-scripts]
# gui-scripts (not scripts) so pip generates a GUI-subsystem launcher on
# Windows -- a console one would flash/show a console window behind the
# actual Qt GUI. No effect on Linux/macOS, where console_scripts and
# gui_scripts produce identical plain shebang wrapper scripts (the
# subsystem distinction is Windows-only).
it-toolbox = "it_toolbox.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The app's own window icon (app.py) -- also the single source packaging/
# {linux,windows,macos}'s build scripts copy from for the desktop entry/
# installer/app-bundle icon, so it has to actually ship in the wheel, not
# just exist in the repo. The .icns is rendered from the .svg; macOS's
# Dock/Finder only take an .icns for a bundle's CFBundleIconFile.
# The Settings page's "Fetch FreeRDP DLLs" button runs scripts/*.ps1 from
# here, so it must ship in the wheel too (the Windows installer has no
# repo checkout to fall back on).
"it_toolbox.resources" = ["icons/*.ico", "icons/*.svg", "icons/*.icns", "scripts/*.ps1", "proftpd/*"]
