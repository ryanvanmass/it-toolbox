[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-toolbox"
version = "0.1.0"
description = "Cross-platform IT tooling desktop app — starting with a GCP IAP connection manager for RDP/SSH."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "PySide6",
    "google-auth",
    "requests",
    "websockets",
    "platformdirs",
    "pyte",
    "ptyprocess; sys_platform != 'win32'",
    "pywinpty; sys_platform == 'win32'",
    "PyGObject; sys_platform == 'linux'",
    "packaging",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
]

[project.scripts]
it-toolbox = "it_toolbox.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
